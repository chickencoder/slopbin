name = "experiment"
main = "src/index.ts"
compatibility_date = "2025-08-01"

# Create the database with:
#   wrangler d1 create experiment
# then paste the database_id below.
[[d1_databases]]
binding = "DB"
database_name = "experiment"
database_id = "REPLACE_WITH_YOUR_DATABASE_ID"

# Secrets (set with `wrangler secret put <NAME>`):
#   GITHUB_WEBHOOK_SECRET - shared secret for the merged-PR webhook (leaderboard)
